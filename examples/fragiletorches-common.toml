#settings
[fragiletorches]
	#Chance that a torch will break during a collision (checks on a tick while entity is inside torch)
	# Default: 0.019999999552965164
	# Range: 0.0 ~ 1.0
	chancetobreak = 0.019999999552965164

		[fragiletorches.entities.gentle]
			#List of 'gentle' entities that will never knock over any tagged torch.  For example, if you remove the entry for players, then players will knock over torches. For example, add minecraft:player to the list to stop players from breaking torches 
			list = ["minecraft:bat", "minecraft:boat", "minecraft:cat", "minecraft:ender_pearl", "minecraft:egg", "minecraft:horse", "minecraft:item", "minecraft:donkey", "minecraft:experience_orb", "minecraft:minecart", "minecraft:villager", "minecraft:wolf"]
